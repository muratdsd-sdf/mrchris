name: Los Ojos veri topla

on:
  # Gunluk zamanlama KAPATILDI (2026-07-07): iki proxy motorunun da aylik
  # bedava kredisi bitiyor ve her calisma hata mailiyle sonuclaniyordu
  # (gunde ~5 istek x 10-25 kredi, 1000+1000 kota aya yetmiyor). Veri artik
  # Turkiye-PC kurulumundan geliyor (proxy'siz, bedava). Gerekirse asagidaki
  # "Run workflow" butonuyla elle calistirilabilir.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Veriyi topla
        env:
          SCRAPFLY_TOKEN: ${{ secrets.SCRAPFLY_TOKEN }}
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
        run: python collector.py

      - name: Veriyi kaydet (commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "veri: $(date +%F)" || echo "Degisiklik yok, atlaniyor."
          git push
